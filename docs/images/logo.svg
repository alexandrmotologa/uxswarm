<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Electric Cyan Sensory Optics Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Amber Hive Energy Gradient -->
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Metallic Facet Gradients -->
    <linearGradient id="slate-plate-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slate-plate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="wing-l-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wing-r-top" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="38" stroke-linejoin="round" />

      <!-- Inner Precision Telemetry Ring (Dashed Cyan) -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="3.5" opacity="0.45" stroke-dasharray="14, 10" />

      <!-- 100% Watertight Solid Base Silhouette (Zero-Leak Layer tightly fitted) -->
      <path d="
        M 0,-275
        L 28,-345 L 60,-335 L 36,-270
        L 85,-230 L 140,-260 L 295,-135 L 290,-30 L 195,95 L 75,55
        L 65,95 L 85,155 L 75,225 L 50,285 L 0,350
        L -50,285 L -75,225 L -85,155 L -65,95
        L -75,55 L -195,95 L -290,-30 L -295,-135 L -140,-260 L -85,-230
        L -36,-270 L -60,-335 L -28,-345
        Z
      " fill="#0b0f19" />

      <!-- ==================== WINGS LAYER (Folded Low-Poly Origami) ==================== -->
      <!-- Left Forewing -->
      <polygon points="-40,-130 -140,-260 -295,-135 -160,-55" fill="url(#wing-l-top)" stroke="#0f172a" stroke-width="2" />
      <polygon points="-160,-55 -295,-135 -290,-30 -150,15" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <!-- Left Hindwing (Tucked Underneath) -->
      <polygon points="-150,15 -290,-30 -195,95 -105,45" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="-105,45 -195,95 -125,75 -60,55" fill="#334155" stroke="#0f172a" stroke-width="2" />

      <!-- Right Forewing (Symmetrical with Volumetric Lighting) -->
      <polygon points="40,-130 140,-260 295,-135 160,-55" fill="url(#wing-r-top)" stroke="#0f172a" stroke-width="2" />
      <polygon points="160,-55 295,-135 290,-30 150,15" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <!-- Right Hindwing -->
      <polygon points="150,15 290,-30 195,95 105,45" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="105,45 195,95 125,75 60,55" fill="#475569" stroke="#0f172a" stroke-width="2" />

      <!-- Leading Edge Razor Accents (Cyan Telemetry Vectors) -->
      <line x1="-140" y1="-260" x2="-295" y2="-135" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
      <line x1="140" y1="-260" x2="295" y2="-135" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" opacity="0.75" />

      <!-- ==================== ANTENNAE SENSORY RADARS ==================== -->
      <!-- Left Antenna (Articulated Scout Probe) -->
      <polygon points="-15,-255 -30,-310 -45,-305 -25,-250" fill="#334155" />
      <polygon points="-30,-310 -55,-350 -70,-340 -40,-305" fill="#1e293b" />
      <polygon points="-55,-350 -70,-340 -62,-330 -47,-340" fill="#00f5ff" />

      <!-- Right Antenna -->
      <polygon points="15,-255 30,-310 45,-305 25,-250" fill="#475569" />
      <polygon points="30,-310 55,-350 70,-340 40,-305" fill="#334155" />
      <polygon points="55,-350 70,-340 62,-330 47,-340" fill="#00f5ff" />

      <!-- ==================== HEAD & COMPOUND OPTICS ==================== -->
      <!-- Cranium Plates -->
      <polygon points="0,-275 -50,-240 0,-215" fill="#334155" />
      <polygon points="0,-275 50,-240 0,-215" fill="#475569" />
      <polygon points="-50,-240 -80,-195 -45,-165 0,-185" fill="#1e293b" />
      <polygon points="50,-240 80,-195 45,-165 0,-185" fill="#334155" />

      <!-- Predatory Compound Optics (Angled Upward, Alert Slit Facets) -->
      <!-- Left Compound Eye -->
      <polygon points="-32,-235 -78,-195 -48,-165 -18,-205" fill="url(#cyan-glow)" stroke="#0f172a" stroke-width="2" />
      <polygon points="-38,-220 -68,-192 -50,-173 -28,-202" fill="#00f5ff" />
      <polygon points="-46,-208 -60,-193 -50,-182 -38,-198" fill="#ffffff" opacity="0.6" />

      <!-- Right Compound Eye -->
      <polygon points="32,-235 78,-195 48,-165 18,-205" fill="url(#cyan-glow)" stroke="#0f172a" stroke-width="2" />
      <polygon points="38,-220 68,-192 50,-173 28,-202" fill="#00f5ff" />
      <polygon points="46,-208 60,-193 50,-182 38,-198" fill="#ffffff" opacity="0.6" />

      <!-- Mandibles & Facial Keel -->
      <polygon points="0,-215 -22,-165 0,-135" fill="#1e293b" />
      <polygon points="0,-215 22,-165 0,-135" fill="#334155" />
      <polygon points="-22,-165 -42,-140 -12,-120 0,-135" fill="#0f172a" />
      <polygon points="22,-165 42,-140 12,-120 0,-135" fill="#1e293b" />
      <polygon points="-12,-120 0,-105 0,-135" fill="#334155" />
      <polygon points="12,-120 0,-105 0,-135" fill="#475569" />

      <!-- ==================== THORAX (Obsidian Armor Core) ==================== -->
      <!-- Pronotum Collar -->
      <polygon points="0,-125 -48,-115 -60,-70 0,-80" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
      <polygon points="0,-125 48,-115 60,-70 0,-80" fill="#334155" stroke="#0f172a" stroke-width="1.5" />

      <!-- Scutum Shield -->
      <polygon points="0,-80 -60,-70 -72,0 0,-10" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,-80 60,-70 72,0 0,-10" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-80 -38,-40 0,-10" fill="#1e293b" />
      <polygon points="0,-80 38,-40 0,-10" fill="#334155" />

      <!-- Amber Swarm Core (Hexagonal Energy Matrix) -->
      <polygon points="0,-60 -20,-35 0,-10 20,-35" fill="url(#amber-accent)" stroke="#0f172a" stroke-width="1.5" />
      <polygon points="0,-48 -10,-35 0,-20 10,-35" fill="#fef08a" opacity="0.9" />

      <!-- Postscutellum Posterior Armor -->
      <polygon points="0,-10 -72,0 -55,60 0,50" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-10 72,0 55,60 0,50" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-10 -30,25 0,50" fill="#0f172a" />
      <polygon points="0,-10 30,25 0,50" fill="#1e293b" />

      <!-- Articulation Waist Petiole -->
      <polygon points="0,50 -28,60 -18,85 0,80" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
      <polygon points="0,50 28,60 18,85 0,80" fill="#475569" stroke="#0f172a" stroke-width="1.5" />

      <!-- ==================== ABDOMEN / GASTER ==================== -->
      <!-- Tergite 1 (Chitin Plate + Amber Chevrons) -->
      <polygon points="0,80 -55,90 -72,140 0,130" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,80 55,90 72,140 0,130" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,95 -40,105 -50,132 0,125" fill="url(#amber-accent)" opacity="0.95" />
      <polygon points="0,95 40,105 50,132 0,125" fill="url(#amber-accent)" opacity="0.95" />

      <!-- Tergite 2 -->
      <polygon points="0,130 -72,140 -62,195 0,185" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,130 72,140 62,195 0,185" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,145 -45,152 -38,185 0,178" fill="#0b0f19" />
      <polygon points="0,145 45,152 38,185 0,178" fill="#1e293b" />

      <!-- Tergite 3 (Secondary Amber Band) -->
      <polygon points="0,185 -62,195 -48,245 0,235" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,185 62,195 48,245 0,235" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,198 -35,206 -28,238 0,230" fill="url(#amber-accent)" opacity="0.95" />
      <polygon points="0,198 35,206 28,238 0,230" fill="url(#amber-accent)" opacity="0.95" />

      <!-- Tergite 4 & Stinger Execution Vector -->
      <polygon points="0,235 -48,245 -22,295 0,350" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,235 48,245 22,295 0,350" fill="#334155" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,240 -15,285 0,345" fill="#00f5ff" opacity="0.85" />
      <polygon points="0,240 15,285 0,345" fill="#0284c7" opacity="0.85" />

    </g>
  </g>
</svg>